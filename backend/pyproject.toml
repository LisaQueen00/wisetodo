[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wisetodo-backend"
version = "0.1.0"
description = "Python sidecar for WiseTodo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "httpx2>=2.12,<3",
  "jsonschema>=4.25,<5",
  "openai>=3.5,<4",
  "keyring>=25.6,<26",
  "langchain-openai>=0.3,<2",
  "langgraph>=1,<2",
  "mcp>=2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "pypdf>=6.18,<7",
  "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pyinstaller>=6,<7",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
wisetodo-sidecar = "wisetodo.main:main"

[tool.hatch.build.targets.wheel]
packages = ["wisetodo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wisetodo"]
